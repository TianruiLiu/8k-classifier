[project]
name = "8k-classifier"
version = "0.1.0"
description = "Prompting vs. fine-tuning for multi-label classification of SEC 8-K filings"
readme = "README.md"
authors = [{ name = "Tianrui Liu" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "openai>=3.57.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=4.48",
]

[tool.uv]
package = false   # a set of scripts in src/, not an installable package
